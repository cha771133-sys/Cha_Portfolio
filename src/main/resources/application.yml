server:
  port: ${PORT:8080}

spring:
  application:
    name: portfolio

  datasource:
    url: jdbc:h2:file:./data/portfolio;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  h2:
    console:
      enabled: true
      path: /h2-console

  thymeleaf:
    cache: false   # 개발 중엔 false, 배포 시 true로 변경
